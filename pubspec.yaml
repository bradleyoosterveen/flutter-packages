name: flutter_packages
publish_to: none
environment:
  sdk: ^3.12.2
workspace:
  - packages/**
dev_dependencies:
  flutter_lints: 6.0.0
  melos: 8.1.0
  index_generator: 4.1.2
melos:
  ide:
    intellij:
      enabled: false
  scripts:
    create:package:
      description: Create a new package in the workspace
      run: dart create -t package packages/ui

    test:
      description: Run tests
      exec: dart test --reporter=expanded
      packageFilters:
        dirExists:
          - 'test'

    generate:index:
      description: Generate indexes
      exec: dart pub run index_generator
      packageFilters:

    format:
      description: Format
      exec: dart format . && dart fix --apply
      packageFilters:

    flutter:version:
      description: Print Flutter version
      exec: flutter --version